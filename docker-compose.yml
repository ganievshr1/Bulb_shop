services:
  # PostgreSQL for Product Service
  product-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCT_DB_NAME}
    ports:
      - "${PRODUCT_DB_PORT:-5432}:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER} -d ${PRODUCT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulbshop-network
    restart: unless-stopped

  # PostgreSQL for Order Service
  order-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_PORT:-5433}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulbshop-network
    restart: unless-stopped

  # PostgreSQL for Admin Service
  admin-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${ADMIN_DB_USER}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
      POSTGRES_DB: ${ADMIN_DB_NAME}
    ports:
      - "${ADMIN_DB_PORT:-5434}:5432"
    volumes:
      - admin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USER} -d ${ADMIN_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulbshop-network
    restart: unless-stopped

  # Product Service
  product-service:
    build: ./product-service
    environment:
      DATABASE_URL: postgresql://${PRODUCT_DB_USER}:${PRODUCT_DB_PASSWORD}@product-db:5432/${PRODUCT_DB_NAME}
      SERVICE_PORT: ${PRODUCT_SERVICE_PORT:-8081}
      LOG_LEVEL: ${PRODUCT_LOG_LEVEL:-INFO}
    ports:
      - "${PRODUCT_SERVICE_PORT:-8081}:${PRODUCT_SERVICE_PORT:-8081}"
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - bulbshop-network
    restart: unless-stopped

  # Order Service
  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@order-db:5432/${ORDER_DB_NAME}
      PRODUCT_SERVICE_URL: http://product-service:${PRODUCT_SERVICE_PORT:-8081}/api/v1
      SERVICE_PORT: ${ORDER_SERVICE_PORT:-8082}
      LOG_LEVEL: ${ORDER_LOG_LEVEL:-INFO}
    ports:
      - "${ORDER_SERVICE_PORT:-8082}:${ORDER_SERVICE_PORT:-8082}"
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - bulbshop-network
    restart: unless-stopped

  # Admin Service
  admin-service:
    build: ./admin-service
    environment:
      DATABASE_URL: postgresql://${ADMIN_DB_USER}:${ADMIN_DB_PASSWORD}@admin-db:5432/${ADMIN_DB_NAME}
      PRODUCT_SERVICE_URL: http://product-service:${PRODUCT_SERVICE_PORT:-8081}/api/v1
      ORDER_SERVICE_URL: http://order-service:${ORDER_SERVICE_PORT:-8082}/api/v1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SERVICE_PORT: ${ADMIN_SERVICE_PORT:-8083}
      LOG_LEVEL: ${ADMIN_LOG_LEVEL:-INFO}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Администратор}
    ports:
      - "${ADMIN_SERVICE_PORT:-8083}:${ADMIN_SERVICE_PORT:-8083}"
    depends_on:
      admin-db:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - bulbshop-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      - product-service
      - order-service
      - admin-service
    networks:
      - bulbshop-network
    restart: unless-stopped

networks:
  bulbshop-network:
    driver: bridge

volumes:
  product_db_data:
  order_db_data:
  admin_db_data:
