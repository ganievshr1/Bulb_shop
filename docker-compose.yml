services:
  # PostgreSQL for Product Service
  product-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulbshop-network

  # PostgreSQL for Order Service
  order-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulbshop-network

  # Product Service
  product-service:
    build: ./product-service
    environment:
      DATABASE_URL: postgresql://product_user:product_pass@product-db:5432/product_db
      SERVICE_PORT: 8081
      LOG_LEVEL: INFO
    ports:
      - "8081:8081"
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - bulbshop-network

  # Order Service
  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://order_user:order_pass@order-db:5432/order_db
      PRODUCT_SERVICE_URL: http://product-service:8081/api/v1
      SERVICE_PORT: 8082
      LOG_LEVEL: INFO
    ports:
      - "8082:8082"
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - bulbshop-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "80:80"
    depends_on:
      - product-service
      - order-service
    networks:
      - bulbshop-network
    restart: unless-stopped

networks:
  bulbshop-network:
    driver: bridge

volumes:
  product_db_data:
  order_db_data: